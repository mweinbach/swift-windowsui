name: macOS reference render

# Renders canonical SwiftUI reference scenes on a macOS GitHub Actions
# runner. Uploads the resulting PNGs as a workflow artifact so the
# Windows CI / local developers can pull them down and run pixel /
# structural-similarity comparisons against WinSwiftUI's output.
#
# This is the macOS-side test infrastructure half of the cross-
# platform visual-parity contract documented in
# docs/MacOSReferenceParityWorkflow.md.
#
# Note: jobs that fail before a runner is assigned (queued forever,
# "Waiting for a runner to pick up this job", billing/minutes
# exhaustion, org runner policy) are account/capacity issues and
# cannot be fixed by workflow YAML alone.

on:
  workflow_dispatch:
  push:
    paths:
      - "Package.swift"
      - "Sources/macos-reference-renderer/**"
      - ".github/workflows/macos-reference-render.yml"
  schedule:
    # Weekly refresh so the reference tracks toolchain / SDK drift.
    - cron: "0 6 * * 1"

# Least privilege: read source, write workflow artifacts only.
permissions:
  contents: read
  actions: write

concurrency:
  group: macos-reference-render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render reference PNGs on macOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report runner / image context
        run: |
          set -euo pipefail
          echo "ImageOS=${ImageOS:-}"
          echo "ImageVersion=${ImageVersion:-}"
          echo "RUNNER_OS=${RUNNER_OS:-} RUNNER_ARCH=${RUNNER_ARCH:-}"
          sw_vers || true
          echo "Installed Xcode apps:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
          echo "Current xcode-select:"
          xcode-select -p || true

      - name: Select Xcode toolchain
        run: |
          set -euo pipefail
          # Package.swift requires Swift 6.2, which Xcode 16.x cannot
          # provide. Choose the newest installed Xcode whose actual Swift
          # version satisfies the manifest instead of trusting its app name.
          # Keep the implementation compatible with macOS's Bash 3.2.
          required_version=$(sed -nE '1s@// swift-tools-version:[[:space:]]*([0-9]+)\.([0-9]+).*@\1 \2@p' Package.swift)
          if [ -z "$required_version" ]; then
            echo "::error::Could not read the Swift tools version from Package.swift"
            exit 1
          fi
          read -r required_major required_minor <<< "$required_version"

          supports_required_swift() {
            local app="$1"
            local swift_binary="$app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
            local version=""
            local major=""
            local minor=""

            if [ ! -x "$swift_binary" ]; then
              return 1
            fi
            version=$("$swift_binary" --version 2>/dev/null | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p' | head -n 1)
            if [ -z "$version" ]; then
              return 1
            fi
            read -r major minor <<< "$version"
            echo "Candidate $app provides Swift $major.$minor"
            [ "$major" -gt "$required_major" ] || {
              [ "$major" -eq "$required_major" ] && [ "$minor" -ge "$required_minor" ]
            }
          }

          # BSD sort does not implement GNU's -V option. Reverse lexical
          # ordering still puts recent Xcode releases first, while checking
          # each candidate's actual Swift version prevents old SDKs slipping in.
          xcode_apps=$(find /Applications -maxdepth 1 \( -type d -o -type l \) -name 'Xcode*.app' -print 2>/dev/null | sort -r)
          selected=""
          while IFS= read -r app; do
            if [ -n "$app" ] && [ -d "$app/Contents/Developer" ] && supports_required_swift "$app"; then
              selected="$app"
              break
            fi
          done <<< "$xcode_apps"

          if [ -z "$selected" ]; then
            echo "::error::No installed Xcode provides Swift $required_major.$required_minor or newer"
            ls -la /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          echo "Selecting Xcode at: $selected"
          sudo xcode-select -s "$selected/Contents/Developer"
          xcode-select -p
          xcodebuild -version
          # Accept license / first-launch when the image requires it.
          sudo xcodebuild -license accept 2>/dev/null || true
          sudo xcodebuild -runFirstLaunch 2>/dev/null || true

      - name: Print Swift version
        run: |
          set -euo pipefail
          swift --version
          which swift
          required_version=$(sed -nE '1s@// swift-tools-version:[[:space:]]*([0-9]+)\.([0-9]+).*@\1 \2@p' Package.swift)
          installed_version=$(swift --version | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p' | head -n 1)
          if [ -z "$required_version" ] || [ -z "$installed_version" ]; then
            echo "::error::Could not verify Swift toolchain compatibility"
            exit 1
          fi
          read -r required_major required_minor <<< "$required_version"
          read -r installed_major installed_minor <<< "$installed_version"
          if [ "$installed_major" -lt "$required_major" ] || {
            [ "$installed_major" -eq "$required_major" ] && [ "$installed_minor" -lt "$required_minor" ]
          }; then
            echo "::error::Package.swift requires Swift $required_major.$required_minor; selected Swift $installed_major.$installed_minor"
            exit 1
          fi

      - name: Build macos-reference-renderer
        run: |
          set -euo pipefail
          swift build --product macos-reference-renderer -c release

      - name: Render reference scenes
        run: |
          set -euo pipefail
          swift run -c release macos-reference-renderer

      - name: Verify complete canonical reference output
        run: |
          set -euo pipefail
          ls -la artifacts/macos-reference
          expected_count=0
          for fixture in \
            button-regular \
            toggle-on \
            slider-mid \
            text-body \
            system-colors \
            stack-default-spacing
          do
            expected_count=$((expected_count + 1))
            path="artifacts/macos-reference/$fixture.png"
            if [ ! -f "$path" ]; then
              echo "::error::Missing canonical macOS reference fixture: $path"
              exit 1
            fi
            if [ ! -s "$path" ]; then
              echo "::error::Canonical macOS reference fixture is empty: $path"
              exit 1
            fi
          done

          png_count=$(find artifacts/macos-reference -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')
          if [ "$png_count" -ne "$expected_count" ]; then
            echo "::error::Expected exactly $expected_count canonical macOS reference PNGs; found $png_count"
            exit 1
          fi
          echo "Verified all $png_count canonical macOS reference PNGs"

      - name: Upload PNG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-reference-png
          path: artifacts/macos-reference/*.png
          if-no-files-found: error
          retention-days: 30

      # This runner/toolchain floats. These are diagnostic observations, not
      # qualification against docs/swiftui-baseline.json's pinned SDK.
      - name: Verify material diagnostic classifier
        run: swift run -c release macos-reference-renderer --self-test-material-diagnostics

      - name: Capture material diagnostics (candidate only)
        env:
          SWIFT_WINDOWSUI_REFERENCE_BUILD_CONFIGURATION: release
        run: swift run -c release macos-reference-renderer --material-diagnostics --hosting-context-experiment

      - name: Upload material diagnostic observations and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-material-diagnostics-candidate
          path: artifacts/macos-reference/material-diagnostics/**
          if-no-files-found: warn
          retention-days: 30
